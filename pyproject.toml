[project]
name = "uxdengineer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.0",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["brain", "brain-2", "projects", ".remember"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
